<svg viewBox="0 0 900 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">A map of metaethical positions</title>
  <desc id="description">Positions plotted on two axes: cognitivism versus non-cognitivism, and realism versus anti-realism. Quasi-realism is shown as a trajectory from the non-cognitivist, anti-realist region toward realist language.</desc>
  <defs>
    <marker id="arrow-brass" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0.5 0.5 9.5 5 0.5 9.5Z" fill="#B0812A"/>
    </marker>
    <style>
      .mono { font-family: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace; }
      .axis-title { fill: #20222C; font-size: 14px; font-weight: 700; letter-spacing: 3px; }
      .axis-note { fill: #77786F; font-size: 10.5px; letter-spacing: .35px; }
      .position { fill: #20222C; font-size: 13px; font-weight: 600; }
      .attribution { fill: #686A64; font-size: 10.5px; }
      .halo { paint-order: stroke; stroke: #F3F1E9; stroke-width: 3px; stroke-linejoin: round; }
      .legend { fill: #454754; font-size: 10.5px; }
    </style>
  </defs>

  <rect x="115" y="95" width="335" height="420" fill="#B0812A" fill-opacity=".14"/>
  <rect x="450" y="95" width="335" height="420" fill="#3A6A6E" fill-opacity=".14"/>
  <rect x="115" y="95" width="670" height="420" rx="4" fill="none" stroke="#20222C" stroke-width="1.6"/>

  <line x1="450" y1="95" x2="450" y2="515" stroke="#20222C" stroke-width="1" stroke-dasharray="2 6" opacity=".48"/>
  <line x1="115" y1="305" x2="785" y2="305" stroke="#20222C" stroke-width="1" stroke-dasharray="2 6" opacity=".48"/>

  <text x="450" y="48" class="mono axis-title" text-anchor="middle">REALISM</text>
  <text x="450" y="69" class="mono axis-note" text-anchor="middle">objective, mind-independent facts</text>
  <text x="450" y="558" class="mono axis-title" text-anchor="middle">ANTI-REALISM</text>
  <text x="450" y="579" class="mono axis-note" text-anchor="middle">no objective moral facts</text>

  <g transform="rotate(-90 54 305)">
    <text x="54" y="299" class="mono axis-title" text-anchor="middle">NON-COGNITIVISM</text>
    <text x="54" y="317" class="mono axis-note" text-anchor="middle">moral claims express attitudes</text>
  </g>
  <g transform="rotate(-90 846 305)">
    <text x="846" y="299" class="mono axis-title" text-anchor="middle">COGNITIVISM</text>
    <text x="846" y="317" class="mono axis-note" text-anchor="middle">moral claims are truth-apt beliefs</text>
  </g>

  <circle cx="720" cy="155" r="5" fill="#2A4F53" stroke="#F3F1E9" stroke-width="1.8"/>
  <text x="704" y="150" class="mono position halo" text-anchor="end">Non-naturalist realism</text>
  <text x="704" y="170" class="mono attribution halo" text-anchor="end">Moore · Parfit · Enoch</text>

  <circle cx="720" cy="215" r="5" fill="#2A4F53" stroke="#F3F1E9" stroke-width="1.8"/>
  <text x="704" y="210" class="mono position halo" text-anchor="end">Naturalist realism</text>
  <text x="704" y="230" class="mono attribution halo" text-anchor="end">Boyd · Railton · Brink</text>

  <circle cx="720" cy="405" r="5" fill="#2A4F53" stroke="#F3F1E9" stroke-width="1.8"/>
  <text x="704" y="400" class="mono position halo" text-anchor="end">Error theory</text>
  <text x="704" y="420" class="mono attribution halo" text-anchor="end">Mackie — every claim false</text>

  <circle cx="750" cy="475" r="5" fill="#2A4F53" stroke="#F3F1E9" stroke-width="1.8"/>
  <text x="734" y="480" class="mono position halo" text-anchor="end">Subjectivism · relativism</text>

  <ellipse cx="520" cy="305" rx="105" ry="74" fill="#F3F1E9" fill-opacity=".34" stroke="#20222C" stroke-width="1.2" stroke-dasharray="4 5" opacity=".82"/>
  <circle cx="480" cy="305" r="5" fill="#20222C" stroke="#F3F1E9" stroke-width="1.8"/>
  <rect x="500" y="266" width="174" height="76" rx="5" fill="#F3F1E9" fill-opacity=".94"/>
  <text x="516" y="289" class="mono position">Constructivism</text>
  <text x="516" y="309" class="mono attribution">Rawls · Korsgaard</text>
  <text x="516" y="327" class="mono attribution">Scanlon</text>

  <circle cx="165" cy="350" r="5" fill="#8A641E" stroke="#F3F1E9" stroke-width="1.8"/>
  <text x="181" y="345" class="mono position halo">Expressivism</text>
  <text x="181" y="365" class="mono attribution halo">Gibbard</text>

  <circle cx="275" cy="405" r="5" fill="#8A641E" stroke="#F3F1E9" stroke-width="1.8"/>
  <text x="291" y="400" class="mono position halo">Prescriptivism</text>
  <text x="291" y="420" class="mono attribution halo">Hare</text>

  <circle cx="165" cy="470" r="5" fill="#8A641E" stroke="#F3F1E9" stroke-width="1.8"/>
  <text x="181" y="465" class="mono position halo">Emotivism</text>
  <text x="181" y="485" class="mono attribution halo">Ayer · Stevenson</text>

  <path d="M225 497 C390 520 470 455 430 340 C400 245 480 160 560 125" fill="none" stroke="#B0812A" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow-brass)"/>
  <circle cx="225" cy="497" r="5" fill="#B0812A" stroke="#F3F1E9" stroke-width="1.8"/>
  <rect x="279" y="440" width="168" height="52" rx="6" fill="#F3F1E9" fill-opacity=".96" stroke="#B0812A" stroke-width=".8"/>
  <text x="363" y="461" class="mono" fill="#8A641E" font-size="11.5" font-weight="600" font-style="italic" text-anchor="middle">quasi-realisation</text>
  <text x="363" y="479" class="mono" fill="#8A641E" font-size="10" text-anchor="middle">Blackburn</text>

  <g transform="translate(136 618)">
    <rect width="17" height="12" rx="2" fill="#B0812A" fill-opacity=".14" stroke="#B0812A"/>
    <text x="25" y="10" class="mono legend">non-cognitivist territory</text>
  </g>
  <g transform="translate(365 618)">
    <rect width="17" height="12" rx="2" fill="#3A6A6E" fill-opacity=".14" stroke="#3A6A6E"/>
    <text x="25" y="10" class="mono legend">cognitivist territory</text>
  </g>
  <g transform="translate(575 618)">
    <rect width="17" height="12" rx="2" fill="none" stroke="#20222C" stroke-width="1.1" stroke-dasharray="3 3"/>
    <text x="25" y="10" class="mono legend">blurs the boundary</text>
  </g>
</svg>
