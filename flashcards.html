<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="flashcards">
  <div id="site-header"></div>

  <main class="page-shell page-shell--wide flashcards-page">
    <section class="page-nav flashcards-toolbar">
      <div>
        <p class="page-kicker">Flashcards</p>
        <h1>Learning Decks</h1>
        <p id="flashcardsSummary" class="page-lead" aria-live="polite">Loading decks...</p>
      </div>
      <nav aria-label="Flashcards sections">
        <ul>
          <li><a href="#flashcardsDecks">Decks</a></li>
          <li><a href="#flashcardsStudy">Study</a></li>
          <li><a href="#flashcardsAddCard">Add Card</a></li>
          <li><a href="#flashcardsCreateDeck">Create Deck</a></li>
        </ul>
      </nav>
    </section>

    <section class="flashcards-grid">
      <aside id="flashcardsDecks" class="flashcards-panel flashcards-panel--decks">
        <div class="flashcards-panel__header">
          <p class="flashcards-panel__eyebrow">Deck Library</p>
          <h2>Existing Decks</h2>
        </div>
        <div id="flashcardsDeckList" class="flashcards-deck-list" aria-live="polite"></div>
      </aside>

      <section id="flashcardsStudy" class="flashcards-panel flashcards-study-panel">
        <div class="flashcards-panel__header flashcards-study-header">
          <div>
            <p class="flashcards-panel__eyebrow">Study</p>
            <h2 id="flashcardsActiveDeckName">No deck selected</h2>
          </div>
          <p id="flashcardsProgress" class="flashcards-progress" aria-live="polite">0 / 0</p>
        </div>

        <button
          id="flashcardsCurrentCard"
          class="flashcards-card"
          type="button"
          aria-label="Flip current flashcard"
        >
          <span id="flashcardsCardSide" class="flashcards-card__side">Question</span>
          <span id="flashcardsCardText" class="flashcards-card__text">Choose a deck to begin.</span>
        </button>

        <div class="flashcards-actions" aria-label="Study actions">
          <button id="flashcardsPreviousCard" type="button">Previous</button>
          <button id="flashcardsFlipCard" type="button">Flip</button>
          <button id="flashcardsNextCard" type="button">Next</button>
          <button id="flashcardsShuffleDeck" type="button">Shuffle Deck</button>
        </div>
      </section>
    </section>

    <section class="flashcards-editor-grid">
      <section id="flashcardsAddCard" class="flashcards-panel">
        <div class="flashcards-panel__header">
          <p class="flashcards-panel__eyebrow">Card Editor</p>
          <h2>Add Card</h2>
        </div>
        <form id="flashcardsAddCardForm" class="flashcards-form">
          <label for="flashcardsQuestionInput">Question</label>
          <textarea
            id="flashcardsQuestionInput"
            rows="4"
            maxlength="900"
            required
            placeholder="What keyword creates a new object instance?"
          ></textarea>

          <label for="flashcardsAnswerInput">Answer</label>
          <textarea
            id="flashcardsAnswerInput"
            rows="4"
            maxlength="900"
            required
            placeholder="new"
          ></textarea>

          <button type="submit">Add Card to Current Deck</button>
          <p id="flashcardsCardFormStatus" class="flashcards-status" aria-live="polite"></p>
        </form>
      </section>

      <section id="flashcardsCreateDeck" class="flashcards-panel">
        <div class="flashcards-panel__header">
          <p class="flashcards-panel__eyebrow">Deck Builder</p>
          <h2>Create Deck</h2>
        </div>
        <form id="flashcardsCreateDeckForm" class="flashcards-form">
          <label for="flashcardsDeckNameInput">Deck Name</label>
          <input
            id="flashcardsDeckNameInput"
            type="text"
            maxlength="80"
            required
            placeholder="Networking Fundamentals"
          >

          <label for="flashcardsDeckDescriptionInput">Description</label>
          <input
            id="flashcardsDeckDescriptionInput"
            type="text"
            maxlength="220"
            placeholder="Short practice prompts for network trivia."
          >

          <button type="submit">Create Flashcard Deck</button>
          <p id="flashcardsDeckFormStatus" class="flashcards-status" aria-live="polite"></p>
        </form>
      </section>
    </section>
  </main>

  <script src="dist/js/theme.js"></script>
  <script src="dist/js/header.js"></script>
  <script src="dist/js/site-core.js"></script>
  <script type="module" src="dist/js/flashcards.js"></script>
</body>
</html>
